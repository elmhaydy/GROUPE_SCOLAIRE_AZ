{# templates/admin/depenses/delete_modal.html — FRAGMENT MODAL #}

<div class="az-card" style="max-width:900px;">
  <h2 style="margin:0 0 8px 0;">Confirmer la suppression</h2>

  <div class="az-pill" style="margin:10px 0;">
    <i class="fa-solid fa-triangle-exclamation"></i>
    <span>
      <b>{{ obj.libelle }}</b> — {{ obj.montant|floatformat:2 }} MAD — {{ obj.date_depense }}
    </span>
  </div>

  <p class="az-sub" style="margin:0 0 12px 0;">
    Cette action est <b>irréversible</b>.
  </p>

  <form method="post"
        action="{% url 'core:depense_delete' obj.id %}"
        style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;">
    {% csrf_token %}

    <button type="button" class="az-btn az-btn-outline" data-azm-close>
      Annuler
    </button>

    <button class="az-btn az-btn-danger" type="submit">
      <i class="fa-solid fa-trash"></i>
      Supprimer
    </button>
  </form>
</div>
