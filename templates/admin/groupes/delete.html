<div class="az-card" style="max-width:100%;margin:0;">

  <h3 style="margin-bottom:8px;">Confirmation</h3>

  <p class="az-sub">
    Supprimer 
    <b>
      {{ groupe.annee.nom }} —
      {{ groupe.niveau.degre.nom }} —
      {{ groupe.niveau.nom }} —
      {{ groupe.nom }}
    </b> ?
  </p>

  <form method="post"
        action="{% url 'core:groupe_delete' groupe.id %}"
        style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;">
    {% csrf_token %}

    <button class="az-btn az-btn-danger" type="submit">
      <i class="fa-solid fa-trash"></i>
      Oui, supprimer
    </button>

    <button type="button"
            class="az-btn az-btn-outline"
            data-azm-close>
      Annuler
    </button>

  </form>
</div>
