<div class="az-modal-head">
  <div>
    <h3 class="az-modal-title">Réinscription</h3>
    <p class="az-modal-sub">
      {{ eleve.nom }} {{ eleve.prenom }}
      {% if eleve.matricule %}— <b>{{ eleve.matricule }}</b>{% endif %}
    </p>
  </div>
  <br>
</div>

<form method="post"
      action="{% url 'core:eleve_reinscrire_modal' eleve.id %}"
      class="az-modal-form"
      data-az-modal-form>
  {% csrf_token %}

  {% if errors.all %}
    <div class="az-alert az-alert-danger" style="margin-bottom:12px;">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span>{{ errors.all }}</span>
    </div>
  {% endif %}

  <div class="az-form-grid az-grid-2">
    <div class="az-field">
      <label><b>Année</b></label>
      <select name="annee" class="az-select" data-reinsc-filter>
        {% for a in annees %}
          <option value="{{ a.id }}" {% if a.id|stringformat:"s" == annee_selected %}selected{% endif %}>
            {{ a.nom }}
          </option>
        {% endfor %}
      </select>
      {% if errors.annee %}
        <div class="az-error-msg">{{ errors.annee }}</div>
      {% endif %}
    </div>

    <div class="az-field">
      <label><b>Niveau</b></label>
      <select name="niveau" class="az-select" data-reinsc-filter>
        <option value="">—</option>
        {% for n in niveaux %}
          <option value="{{ n.id }}" {% if n.id|stringformat:"s" == niveau_selected %}selected{% endif %}>
            {{ n.degre.nom }} — {{ n.nom }}
          </option>
        {% endfor %}
      </select>
    </div>

    <div class="az-field" style="grid-column:span 2;">
      <label><b>Groupe</b></label>
      <select name="groupe" class="az-select" required>
        <option value="">— Sélectionner un groupe —</option>
        {% for g in groupes %}
          <option value="{{ g.id }}" {% if g.id|stringformat:"s" == groupe_selected %}selected{% endif %}>
            {{ g.annee.nom }} — {{ g.niveau.nom }} — {{ g.nom }}
          </option>
        {% endfor %}
      </select>
      {% if errors.groupe %}
        <div class="az-error-msg">{{ errors.groupe }}</div>
      {% endif %}
    </div>

    <div class="az-field" style="grid-column:span 2;">
      <label><b>Période</b> (optionnel)</label>
      <select name="periode" class="az-select">
        <option value="">—</option>
        {% for p in periodes %}
          <option value="{{ p.id }}" {% if p.id|stringformat:"s" == periode_selected %}selected{% endif %}>
            {{ p.nom }}
          </option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="az-form-actions" style="margin-top:16px;">
    <button class="az-btn az-btn-outline" type="button" data-azm-close>
      Annuler
    </button>
    <button class="az-btn az-btn-gradient" type="submit">
      <i class="fa-solid fa-check"></i> Réinscrire
    </button>
  </div>
</form>
