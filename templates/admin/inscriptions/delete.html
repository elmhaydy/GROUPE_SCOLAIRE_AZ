{# templates/admin/inscriptions/delete_modal.html — FRAGMENT MODAL #}

<div class="az-card" style="max-width:900px;">
  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;">
    <div>
      <h2 style="margin:0 0 6px 0;">Confirmation</h2>
      <p class="az-sub" style="margin:0;">
        Supprimer l’inscription de
        <b>{{ insc.eleve.matricule }} — {{ insc.eleve.nom }} {{ insc.eleve.prenom }}</b>
        pour <b>{{ insc.annee.nom }}</b> ({{ insc.groupe.nom }}) ?
      </p>
      <p class="az-sub" style="margin-top:6px;">
        Cette action est <b>irréversible</b>.
      </p>
    </div>
  </div>

  <form method="post"
        action="{% url 'core:inscription_delete' insc.id %}"
        style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;">
    {% csrf_token %}

    <button type="button" class="az-btn az-btn-outline" data-azm-close>
      Annuler
    </button>

    <button class="az-btn az-btn-danger" type="submit">
      <i class="fa-solid fa-trash"></i>
      Supprimer
    </button>
  </form>
</div>
