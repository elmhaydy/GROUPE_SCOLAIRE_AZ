<div class="az-card" style="max-width:100%;margin:0;">
  <h2 style="margin:0 0 8px 0;">Confirmation</h2>

  <p class="az-sub" style="margin:0 0 12px 0;">
    Tu es sûr de vouloir <b>désactiver</b> la matière
    <b>{{ matiere.nom }}</b> ?
  </p>

  <div class="az-card" style="padding:14px; margin-bottom:14px; border:1px solid rgba(255,80,80,.25); background:rgba(255,80,80,.04);">
    <div style="font-weight:800;color:rgba(255,120,120,.95);">
      Action appliquée
    </div>
    <div class="az-sub" style="margin-top:6px;">
      La matière ne sera pas supprimée définitivement. Elle sera <b>désactivée</b> et l’historique sera conservé.
    </div>
  </div>

  <form method="post"
        action="{% url 'core:matiere_delete' matiere.id %}"
        style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;">
    {% csrf_token %}

    <button type="button" class="az-btn az-btn-outline" data-azm-close>
      Annuler
    </button>

    <button class="az-btn az-btn-danger" type="submit">
      <i class="fa-solid fa-ban"></i>
      Désactiver
    </button>
  </form>
</div>
