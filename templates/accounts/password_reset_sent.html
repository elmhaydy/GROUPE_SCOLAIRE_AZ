{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Email envoyé | Groupe Scolaire</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/logo-emb.png' %}">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Inter',-apple-system,sans-serif; color:#0f172a;
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:20px; background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#0f172a 100%);
    }
    .card {
      background:rgba(255,255,255,.92); border-radius:24px; padding:48px 40px;
      width:100%; max-width:420px; text-align:center;
      box-shadow:0 25px 50px -12px rgba(0,0,0,.5);
    }
    .icon-wrap {
      width:72px; height:72px; border-radius:50%; background:#d1fae5;
      display:flex; align-items:center; justify-content:center;
      margin:0 auto 24px; font-size:2rem; color:#10b981;
    }
    h1 { font-size:1.35rem; font-weight:700; margin-bottom:10px; }
    p  { color:#64748b; font-size:.88rem; line-height:1.6; margin-bottom:14px; }
    .note { background:#f0fdf4; border:1px solid #bbf7d0; border-radius:10px; padding:12px 14px; font-size:.8rem; color:#166534; margin-bottom:24px; }
    .btn {
      display:inline-flex; align-items:center; gap:8px;
      padding:12px 28px; background:#2563eb; color:#fff;
      border-radius:12px; font-size:.9rem; font-weight:600;
      text-decoration:none; transition:background .2s;
    }
    .btn:hover { background:#1e40af; }

    @media (max-width: 480px) {
      body { padding: 14px 10px; }
      .card { padding: 28px 18px; border-radius: 20px; }
      .btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
<div class="card">
  <div class="icon-wrap"><i class="fa-solid fa-envelope-circle-check"></i></div>
  <h1>Email envoyé !</h1>
  <p>
    Si votre identifiant correspond à un compte avec une adresse email,
    vous recevrez sous peu un lien pour réinitialiser votre mot de passe.
  </p>
  <div class="note">
    <i class="fa-solid fa-clock"></i>
    Pensez à vérifier vos <strong>spams</strong>. Le lien expire dans <strong>24&nbsp;heures</strong>.
  </div>
  <a href="{% url 'accounts:login' %}" class="btn">
    <i class="fa-solid fa-arrow-left"></i> Retour à la connexion
  </a>
</div>
</body>
</html>
