{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nouveau mot de passe | Groupe Scolaire</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/logo-emb.png' %}">
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1e40af;
      --danger: #ef4444;
      --dark: #0f172a;
      --glass: rgba(255,255,255,.94);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Inter',-apple-system,sans-serif; color:var(--dark);
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:20px; background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#0f172a 100%);
    }
    .card {
      background:var(--glass); border-radius:24px; padding:44px 36px;
      width:100%; max-width:440px;
      box-shadow:0 25px 50px -12px rgba(0,0,0,.5);
    }
    .logo { text-align:center; margin-bottom:24px; }
    .logo img { height:56px; }
    .lock-icon {
      width:64px; height:64px; border-radius:18px;
      background:linear-gradient(135deg,#10b981,#059669);
      color:#fff; display:flex; align-items:center; justify-content:center;
      font-size:1.6rem; margin:0 auto 16px;
      box-shadow:0 8px 20px rgba(16,185,129,.35);
    }
    h1 { font-size:1.35rem; font-weight:800; text-align:center; margin-bottom:6px; color:#0f172a; }
    .subtitle { text-align:center; color:#64748b; font-size:.88rem; margin-bottom:24px; }
    .form-group { margin-bottom:18px; }
    label { display:block; font-size:.8rem; font-weight:700; color:#374151; margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em; }
    .input-wrap { position:relative; }
    .input-icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:#94a3b8; font-size:.9rem; }
    input { width:100%; padding:12px 14px 12px 40px; border:1.5px solid #cbd5e1; border-radius:12px; font-size:.9rem; outline:none; transition:border-color .2s; background:#fff; }
    input:focus { border-color:#10b981; }
    .alert-error {
      background:#fef2f2; border:1px solid #fecaca; color:#b91c1c;
      border-radius:12px; padding:12px 16px; font-size:.85rem;
      margin-bottom:20px; display:flex; align-items:center; gap:8px;
    }
    .btn-primary {
      width:100%; padding:14px; background:linear-gradient(135deg,#10b981,#059669); color:#fff;
      border:none; border-radius:14px; font-size:1rem; font-weight:700;
      cursor:pointer; transition:all .2s ease; display:flex; align-items:center; justify-content:center; gap:8px;
      box-shadow:0 8px 20px rgba(16,185,129,.35);
    }
    .btn-primary:hover {
      transform:translateY(-1px); box-shadow:0 12px 24px rgba(16,185,129,.45);
    }
    .back-link {
      display:block; text-align:center; margin-top:20px; font-size:.83rem; color:#64748b; text-decoration:none;
    }
    .back-link:hover { color:#10b981; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <img src="{% static 'img/logo-emb.png' %}" alt="Groupe Scolaire" onerror="this.style.display='none'">
  </div>

  <div class="lock-icon">
    <i class="fa-solid fa-lock"></i>
  </div>

  <h1>Créer un nouveau mot de passe</h1>
  <p class="subtitle">Code de vérification validé ! Choisissez votre nouveau mot de passe sécurisé.</p>

  {% if error %}
  <div class="alert-error">
    <i class="fa-solid fa-triangle-exclamation"></i>
    <span>{{ error }}</span>
  </div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label for="password1">Nouveau mot de passe</label>
      <div class="input-wrap">
        <i class="input-icon fa-solid fa-key"></i>
        <input type="password" id="password1" name="password1" placeholder="Minimum 8 caractères" autofocus required minlength="8">
      </div>
    </div>

    <div class="form-group">
      <label for="password2">Confirmer le mot de passe</label>
      <div class="input-wrap">
        <i class="input-icon fa-solid fa-shield"></i>
        <input type="password" id="password2" name="password2" placeholder="Répétez le mot de passe" required minlength="8">
      </div>
    </div>

    <button type="submit" class="btn-primary">
      <i class="fa-solid fa-floppy-disk"></i> Enregistrer le nouveau mot de passe
    </button>
  </form>

  <a href="{% url 'accounts:login' %}" class="back-link">
    <i class="fa-solid fa-arrow-left"></i> Annuler et retourner au login
  </a>
</div>
</body>
</html>
